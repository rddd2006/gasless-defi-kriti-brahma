services:
  gasless-rollup:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL}
        PRIVATE_KEY: ${PRIVATE_KEY}
    container_name: gasless-rollup
    ports:
      - "4000:4000"
      - "8080:8080"
    environment:
      - SEPOLIA_RPC_URL=${SEPOLIA_RPC_URL}
      - PRIVATE_KEY=${PRIVATE_KEY}
      - CONTRACT_ADDRESS=${CONTRACT_ADDRESS}
      - NODE_ENV=development
    env_file:
      - .env
    stdin_open: true
    tty: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "${import.meta.env.VITE_BACKEND_URL}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
