version: "3.9"

services:

  relayer:
    build:
      context: .
      dockerfile: Dockerfile.relayer
    container_name: rollup_relayer
    env_file:
      - .env
    ports:
      - "4000:4000"
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: rollup_frontend
    ports:
      - "3000:3000"
    restart: always

  foundry:
    build:
      context: .
      dockerfile: Dockerfile.foundry
    container_name: rollup_foundry